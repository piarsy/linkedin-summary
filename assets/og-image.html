<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }

    body {
      position: relative;
      width: 1200px;
      height: 627px;
      margin: 0;
      overflow: hidden;
      background: #F1EFE8;
      color: #111A20;
      font-family: Lato, "Liberation Sans", Arial, sans-serif;
    }

    .left {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 690px;
      padding: 88px 0 78px 104px;
    }

    .eyebrow,
    .role {
      margin: 0;
      color: #1E556B;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 44px 0 32px;
      font-size: 65px;
      font-weight: 900;
      letter-spacing: -0.055em;
      line-height: 0.92;
    }

    .subline {
      width: 470px;
      margin: 0;
      color: #48545A;
      font-size: 25px;
      font-weight: 700;
      line-height: 1.2;
    }

    .role { position: absolute; bottom: 82px; }

    .divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 690px;
      width: 1px;
      background: rgba(104, 117, 122, 0.28);
    }

    .diagram {
      position: absolute;
      top: 88px;
      right: 95px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 310px;
    }

    .node {
      width: 310px;
      padding: 17px 20px;
      background: rgba(30, 85, 107, 0.06);
      color: #111A20;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      text-align: center;
    }

    .node.accent { background: #1E556B; color: #FBFAF6; }

    .arrow {
      height: 48px;
      color: #68757A;
      font-size: 39px;
      font-weight: 400;
      line-height: 1.1;
    }

    .diagram-label {
      margin: 26px 0 0;
      color: #48545A;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .cta {
      margin: 14px 0 0;
      color: #1E556B;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <section class="left">
    <p class="eyebrow">Pierre-Arnaud SY</p>
    <h1>Relier stratégie,<br>terrain et équipes.</h1>
    <p class="subline">Pour transformer les décisions en résultats concrets.</p>
    <p class="role">Directeur Général / COO B2B</p>
  </section>
  <div class="divider" aria-hidden="true"></div>
  <section class="diagram" aria-label="Stratégie vers terrain et équipes">
    <div class="node">STRATÉGIE</div>
    <div class="arrow">↓</div>
    <div class="node accent">TERRAIN</div>
    <div class="arrow">↓</div>
    <div class="node">ÉQUIPES</div>
    <p class="diagram-label">Décider · Aligner · Exécuter</p>
    <p class="cta">Découvrir mon approche →</p>
  </section>
</body>
</html>
