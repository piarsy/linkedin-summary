<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 1200px;
      height: 627px;
      margin: 0;
      overflow: hidden;
      background: #F1EFE8;
      color: #111A20;
      font-family: Lato, "Liberation Sans", Arial, sans-serif;
      padding: 84px 110px;
    }
    .axis { position: absolute; top: 0; bottom: 0; left: 510px; width: 1px; background: rgba(104, 117, 122, 0.28); }
    .axis::before, .axis::after { content: ""; position: absolute; left: -7px; width: 11px; height: 11px; border: 2px solid #1E556B; border-radius: 50%; background: #F1EFE8; }
    .axis::before { top: 154px; }
    .axis::after { bottom: 154px; }
    .eyebrow { margin: 0 0 24px; color: #1E556B; font-size: 17px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
    h1 { width: 800px; margin: 0; font-size: 70px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.94; }
    .sub { margin: 30px 0 0; color: #48545A; font-size: 30px; font-weight: 700; }
    .role { position: absolute; left: 620px; bottom: 98px; color: #1E556B; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="axis"></div>
  <p class="eyebrow">Pierre-Arnaud SY</p>
  <h1>Relier stratégie,<br>terrain et équipes.</h1>
  <p class="sub">Pour transformer les décisions en résultats concrets.</p>
  <p class="role">Directeur Général / COO B2B</p>
</body>
</html>
